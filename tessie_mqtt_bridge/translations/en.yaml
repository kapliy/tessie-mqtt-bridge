configuration:
  device_name:
    name: "Device Name"
    description: >-
      Name shown for this device in Home Assistant. Also drives the
      auto-generated entity IDs via slugification, e.g. "Tesla (Streaming)"
      becomes device_tracker.tesla_streaming_location. Pick something
      distinct if you have multiple cars. Existing entities won't auto-rename
      after a change — adjust their entity IDs in HA's UI if needed.
  home_latitude:
    name: "Home Latitude (0 = auto-detect from zone.home)"
    description: >-
      Override the home zone latitude. Leave at 0 to auto-detect from
      your Home Assistant zone.home via the supervisor API.
  home_longitude:
    name: "Home Longitude (0 = auto-detect from zone.home)"
    description: >-
      Override the home zone longitude. Leave at 0 to auto-detect from
      your Home Assistant zone.home via the supervisor API.
  home_radius_meters:
    name: "Home Radius in meters (100 = use zone.home radius)"
    description: >-
      Distance threshold for the home/not_home state. Leave at 100 to use
      your zone.home radius instead of this value.
