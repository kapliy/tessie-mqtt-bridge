configuration:
  offline_grace_seconds:
    name: "Offline Grace (seconds)"
    description: >-
      How long to wait before publishing availability=offline after the
      Tessie WebSocket closes. Tessie's server idles connections at ~60
      minutes; the bridge reconnects in ~1 second. With grace > 0 those
      routine closes become invisible to HA. 30s is a good default.
      Set to 0 to flap on every close (legacy behavior).
  expire_after_seconds:
    name: "Stale Data Timeout (seconds)"
    description: >-
      Mark each streamed entity as `unavailable` if no fresh state arrives
      within this window. CAUTION: for slow-changing fields like Charge
      State, Tessie may not emit messages frequently enough to keep this
      timer alive — the entity flaps to unavailable and any automation
      trigger using `not_from: [unavailable, unknown]` will be suppressed
      on the recovery transition. Default 0 (disabled). Use the bridge's
      Offline Grace + your trigger's `not_from` guard for replay
      protection instead.
  device_name:
    name: "Device Name"
    description: >-
      Name shown for this device in Home Assistant. Also drives the
      auto-generated entity IDs via slugification, e.g. "Tesla (Streaming)"
      becomes device_tracker.tesla_streaming_location. Pick something
      distinct if you have multiple cars. Existing entities won't auto-rename
      after a change — adjust their entity IDs in HA's UI if needed.
  home_latitude:
    name: "Home Latitude (0 = auto-detect from zone.home)"
    description: >-
      Override the home zone latitude. Leave at 0 to auto-detect from
      your Home Assistant zone.home via the supervisor API.
  home_longitude:
    name: "Home Longitude (0 = auto-detect from zone.home)"
    description: >-
      Override the home zone longitude. Leave at 0 to auto-detect from
      your Home Assistant zone.home via the supervisor API.
  home_radius_meters:
    name: "Home Radius in meters (100 = use zone.home radius)"
    description: >-
      Distance threshold for the home/not_home state. Leave at 100 to use
      your zone.home radius instead of this value.
