name: lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-and-ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools and runtime deps
        # ty needs runtime imports resolvable (websockets, paho-mqtt, python-dotenv)
        # to type-check, so install requirements alongside the tools.
        run: |
          pip install ruff ty
          pip install -r tessie_mqtt_bridge/requirements.txt
      - name: ruff check
        run: ruff check
      - name: ty check
        run: ty check
