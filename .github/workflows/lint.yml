name: lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-and-ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff ty
      - name: ruff check
        run: ruff check
      - name: ty check
        run: ty check
